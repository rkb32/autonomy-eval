[browser]
gatherUsageStats = false

# Neutral, report-style theme. Red is reserved for regressions (set in app.py), not for chrome.
[theme]
primaryColor = "#475569"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#334155"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
linkColor = "#334155"
borderColor = "#e4e4e7"
dataframeBorderColor = "#e4e4e7"
dataframeHeaderBackgroundColor = "#f4f4f5"
codeBackgroundColor = "#f4f4f5"
codeTextColor = "#18181b"

[theme.dark]
primaryColor = "#cbd5e1"
backgroundColor = "#0E1013"
secondaryBackgroundColor = "#16181D"
textColor = "#E6E8EB"
linkColor = "#cbd5e1"
borderColor = "#262A31"
dataframeBorderColor = "#262A31"
dataframeHeaderBackgroundColor = "#16181D"
codeBackgroundColor = "#16181D"
codeTextColor = "#E6E8EB"
