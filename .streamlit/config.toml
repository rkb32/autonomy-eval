[browser]
gatherUsageStats = false

# Neutral, report-style theme. Red is reserved for regressions (set in app.py), not for chrome.
[theme]
primaryColor = "#475569"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#334155"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
linkColor = "#334155"
borderColor = "#e4e4e7"
dataframeBorderColor = "#e4e4e7"
dataframeHeaderBackgroundColor = "#f4f4f5"
codeBackgroundColor = "#f4f4f5"
codeTextColor = "#18181b"

[theme.dark]
primaryColor = "#cbd5e1"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#181b21"
textColor = "#e4e4e7"
linkColor = "#cbd5e1"
borderColor = "#2a2e36"
dataframeBorderColor = "#2a2e36"
dataframeHeaderBackgroundColor = "#181b21"
codeBackgroundColor = "#181b21"
codeTextColor = "#e4e4e7"
