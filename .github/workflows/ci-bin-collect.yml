name: Collect CI .bin logs

# Saves the ArduPilot autotest .BIN logs for two tests each day, so there is a real .bin baseline.
# The server overwrites these logs daily, so a missed day cannot be fetched again. Each day's logs
# go into one zip attached to the release "ci-bin-collection", which does not expire. The log numbers
# are sequence numbers, so each day's zip is a full snapshot, dated in its name. Scheduled runs only
# fire from the default branch.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the day's Rover-Scripting and TerrainFailsafe logs
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsS --retry 3 -m 120 -o index.html https://autotest.ardupilot.org/
          grep -oE 'Rover-Scripting-[0-9]{8}\.BIN|ArduCopter-TerrainFailsafe-[0-9]{8}\.BIN' index.html | sort -u > files.txt
          echo "files listed: $(wc -l < files.txt)"
          [ -s files.txt ] || { echo "the index lists no logs" >&2; exit 1; }
          # curl --retry does not cover a connection reset mid-download (run 43900362913 died on one file),
          # so each file gets its own retries with a growing pause. curl exit 22 is an HTTP error such as
          # 404: the server does not have that file, so retrying cannot help and the file is skipped.
          fetch() {
            for attempt in 1 2 3 4 5; do
              rc=0
              curl -fsS -m 120 -o "$2" "$1" || rc=$?
              if [ "$rc" -eq 0 ]; then return 0; fi
              rm -f "$2"
              if [ "$rc" -eq 22 ]; then return 22; fi
              echo "retry $attempt for $(basename "$2")" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          : > bin/_missing.txt
          downloaded=0
          while read -r f; do
            rc=0
            fetch "https://autotest.ardupilot.org/$f" "bin/$f" || rc=$?
            if [ "$rc" -eq 0 ]; then
              downloaded=$((downloaded + 1))
            elif [ "$rc" -eq 22 ]; then
              echo "listed but not on the server (HTTP error): $f" >&2
              echo "$f" >> bin/_missing.txt
            else
              echo "failed after retries: $f" >&2
              exit 1
            fi
          done < files.txt
          [ "$downloaded" -gt 0 ] || { echo "no logs downloaded" >&2; exit 1; }
          cp files.txt bin/_listing.txt
          (cd bin && sha256sum *.BIN > ../manifest.sha256)
          echo "run date (UTC): $(date -u +%F)" > bin/_run.txt
          echo "total size: $(du -sh bin | cut -f1)"

      - name: Attach the day's logs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          zipfile="ci-bin-$day.zip"
          (cd bin && zip -qr "../$zipfile" . -x '*.zip') && zip -q "$zipfile" manifest.sha256
          tag="ci-bin-collection"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CI .bin collection" \
            --notes "Daily snapshots of the ArduPilot autotest .BIN logs for Rover-Scripting and ArduCopter-TerrainFailsafe. One zip per day; each zip is a full snapshot with a sha256 manifest." \
            --latest=false
          gh release upload "$tag" "$zipfile" --repo "$GITHUB_REPOSITORY" --clobber
          ls -l "$zipfile"
