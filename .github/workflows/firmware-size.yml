# Firmware size for two ArduPilot commits, using ArduPilot's own size_compare_branches.py.
#
# Run it by hand from the Actions tab (workflow_dispatch). It checks out ArduPilot, builds the chosen
# board and vehicle at both commits, and uploads a CSV of the .bin size differences as an artifact.
# The full script output is kept too (raw.log), so a failed build can be read from the artifact.
# The web demo does not read this yet; publishing the CSV into the repo is a separate step.

name: Firmware size (two ArduPilot commits)

on:
  workflow_dispatch:
    inputs:
      base:
        description: "ArduPilot commit or branch to compare from (the master side)"
        required: true
        default: master
      head:
        description: "ArduPilot commit or branch to compare to (the branch side)"
        required: true
      board:
        description: "Board name from ArduPilot's hwdef files, for example CubeOrange"
        required: true
        default: CubeOrange
      vehicle:
        description: "Vehicle to build: copter, plane, rover or sub"
        required: true
        default: copter

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          fetch-depth: 0
          submodules: recursive
          path: ardupilot

      - name: Install build prerequisites
        working-directory: ardupilot
        run: Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Put the ARM toolchain on PATH for later steps
        run: |
          echo "/opt/gcc-arm-none-eabi-10-2020-q4-major/bin" >> "$GITHUB_PATH"
          /opt/gcc-arm-none-eabi-10-2020-q4-major/bin/arm-none-eabi-gcc --version | head -n 1

      - name: Compare the two builds
        working-directory: ardupilot
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          BOARD: ${{ inputs.board }}
          VEHICLE: ${{ inputs.vehicle }}
        run: |
          set -o pipefail
          python3 Tools/scripts/size_compare_branches.py \
            --branch "$HEAD" \
            --master-branch "$BASE" \
            --board "$BOARD" \
            --vehicle "$VEHICLE" \
            --no-merge-base 2>&1 | tee "$GITHUB_WORKSPACE/raw.log"
          # keep only the CSV table; the script also prints progress lines before it
          awk '/^Board,/{f=1} f' "$GITHUB_WORKSPACE/raw.log" > "$GITHUB_WORKSPACE/size.csv"
          cat "$GITHUB_WORKSPACE/size.csv"

      - name: Upload the size table and the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-size-${{ inputs.board }}-${{ inputs.vehicle }}
          path: |
            size.csv
            raw.log
